services:
  db:
    image: postgres:15-alpine
    container_name: sla_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sla_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/sla_system-backend:latest
    container_name: sla_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sla_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/organization?org_id=ALL"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/sla_system-frontend:latest
    container_name: sla_frontend_prod
    restart: always
    depends_on:
      - backend
    volumes:
      - frontend_static:/usr/share/nginx/html
    networks:
      - sla_network

  nginx:
    image: nginx:alpine
    container_name: sla_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sla_network

volumes:
  postgres_data:
  certbot_conf:
  certbot_www:
  frontend_static:

networks:
  sla_network:
    driver: bridge
