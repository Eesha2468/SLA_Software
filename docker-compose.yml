services:
  backend:
    build:
      context: .
      target: backend
    container_name: sla_backend
    restart: always
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    expose:
      - "5000"
    networks:
      - sla_network

  frontend:
    build:
      context: .
      target: frontend
    container_name: sla_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sla_network

networks:
  sla_network:
    driver: bridge
